project_id = "apice-fiscal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.mercadopago-webhook]
verify_jwt = false

[functions.kirvano-webhook]
verify_jwt = false

[functions.create-subscription]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.get-material-url]
verify_jwt = true

[functions.admin-set-role]
verify_jwt = true
