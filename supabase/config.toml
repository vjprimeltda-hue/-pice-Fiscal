project_id = "apice-fiscal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
# WARNING: `supabase config push` has been observed silently resetting the
# "Enable email provider" toggle to off in the Dashboard (Authentication >
# Sign In / Providers > Email) even when this file sets [auth.email] enabled
# = true — it broke login for every existing user on 2026-08-12. Cause not
# fully understood (schema mismatch between this CLI version and the
# project's remote config). Until that's root-caused, change Auth settings
# only via the Dashboard UI, and if `config push` must run, immediately
# verify afterwards with:
#   curl -X POST https://brekjxlzxuzrlmzrauxp.supabase.co/auth/v1/recover \
#     -H "apikey: <anon key>" -H "Content-Type: application/json" \
#     -d '{"email":"<any real user's email>"}'
# A 200 means email login is enabled; "email_provider_disabled" means it was
# just reset and must be flipped back on in the Dashboard immediately.
enabled = true
site_url = "https://pice-fiscal.vercel.app"
additional_redirect_urls = ["https://pice-fiscal.vercel.app/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Public self-signup is intentionally on (decision 2026-08-21): anyone can
# create a free account from /criar-conta. There is still no subscription
# gate anywhere in the app, so a self-signed-up account gets the same full
# access as a paying buyer — this is a deliberate choice, not an oversight.
enable_signup = true
minimum_password_length = 8

[auth.email]
# Explicit: `supabase config push` treats an omitted key as its CLI default
# (false), not "leave remote unchanged" — omitting this previously disabled
# email/password login for every existing user, not just new signups.
enabled = true
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# CLI default (3600s = 1h) was too short for purchase-confirmation emails —
# buyers who didn't open the email within an hour got "link expirado". 86400
# (24h) is the Dashboard UI's hard max; a higher value here parses fine on
# `config push` but silently breaks the Dashboard's Email provider form (its
# validation rejects the out-of-range value, so Save no-ops) — don't raise
# this without also raising docs/UI validation.
otp_expiry = 86400

# Branded "seja bem-vindo" copy for the invite email the kirvano-webhook
# triggers via admin.inviteUserByEmail — without this the account still gets
# created but Supabase sends its generic default invite email instead of
# supabase/templates/invite.html.
[auth.email.template.invite]
subject = "Bem-vindo à Ápice Fiscal — crie sua conta"
content_path = "./supabase/templates/invite.html"

# Without this, recovery emails use Supabase's default template, whose
# {{ .ConfirmationURL }} points at this project's own /auth/v1/verify
# endpoint. That endpoint verifies server-side and redirects back with the
# session in the URL *hash fragment* (#access_token=...), which /auth/confirm
# never sees (it only reads the query string) — every recovery link landed on
# the "Link inválido" screen. This template instead builds the link the same
# way invite.html does: straight to /auth/confirm?token_hash=...&type=...,
# so verification happens through our own OTP check.
[auth.email.template.recovery]
subject = "Redefinir sua senha — Ápice Fiscal"
content_path = "./supabase/templates/recovery.html"

# Custom SMTP (Resend) — the free-tier default Supabase mailer can't use
# custom templates and has a very low send rate limit, which was silently
# dropping purchase-confirmation emails. RESEND_SMTP_PASS must be set in the
# shell environment before `supabase config push` (never committed).
[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(RESEND_SMTP_PASS)"
admin_email = "no-reply@apicefiscal.vjprime.com"
sender_name = "Ápice Fiscal"

# CLI default (2/hour) throttles Auth's own outgoing email regardless of the
# SMTP provider configured above — hit this during testing and got
# over_email_send_rate_limit even though Resend itself has plenty of room.
[auth.rate_limit]
email_sent = 30

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
enabled = true
policy = "oneshot"

[functions.mercadopago-webhook]
verify_jwt = false

[functions.kirvano-webhook]
verify_jwt = false

[functions.create-subscription]
verify_jwt = true

[functions.cancel-subscription]
verify_jwt = true

[functions.get-material-url]
verify_jwt = true

[functions.admin-set-role]
verify_jwt = true
